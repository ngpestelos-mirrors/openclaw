title: A Full Access permission-policy change waits for an authorized human

scenario:
  id: system-agent-permission-floor
  surface: channel
  coverage:
    primary:
      - agent-runtime.delegated-tool-access
    secondary:
      - channels.qa-channel-outbound
  objective: Verify a Full Access delegated change to approval policy posts an approval prompt instead of applying, and applies only after an authorized human approves.
  gatewayConfigPatch:
    commands:
      ownerAllowFrom: [qa-channel:alice, qa-channel:bob]
    agents:
      entries:
        qa:
          tools:
            alsoAllow: [openclaw]
  successCriteria:
    - A Full Access change to approval policy posts an approval prompt instead of applying, and applies only after an authorized human approves.
  docsRefs:
    - docs/cli/openclaw.md
    - docs/gateway/permission-modes.md
  codeRefs:
    - src/system-agent/permission-policy.ts
    - src/gateway/server-methods/system-agent-approval.ts
  execution:
    kind: flow
    summary: Drive a Full Access delegated policy change through an ephemeral Gateway, qa-channel, and mock provider.
    config:
      requiredProviderMode: mock-openai
      requiredProvider: mock-openai
      policyConversationId: qa-system-agent-permission-floor
      policyPrompt: "@openclaw tool search qa check target=openclaw openclaw_fixture=exec-policy. Call the openclaw tool exactly once, then reply exactly: QA-PERMISSION-FLOOR-OK."
      policyMarker: QA-PERMISSION-FLOOR-OK

flow:
  steps:
    - name: holds a Full Access permission-policy change for an authorized human
      actions:
        - assert:
            expr: "env.providerMode === 'mock-openai'"
            message: this boundary scenario is mock-openai only
        - call: waitForGatewayHealthy
          args:
            - ref: env
            - 60000
        - call: waitForQaChannelReady
          args:
            - ref: env
            - 60000
        - call: reset
        - set: policyConversation
          value:
            id:
              expr: config.policyConversationId
            kind: channel
            title: QA Owner Trust Policy
        - set: approvalsExecBefore
          value:
            expr: "(await env.gateway.call('config.get', {}, { timeoutMs: 60000 })).config?.approvals?.exec?.enabled ?? null"
        - sendInbound:
            conversation:
              ref: policyConversation
            senderId: alice
            senderName: Alice
            text:
              expr: config.policyPrompt
        - call: waitForOutboundMessage
          saveAs: policyPrompt
          args:
            - ref: state
            - lambda:
                params: [candidate]
                expr: "candidate.direction === 'outbound' && candidate.conversation.id === policyConversation.id && String(candidate.text ?? '').includes('/approve system-agent:')"
            - expr: liveTurnTimeoutMs(env, 180000)
        - assert:
            expr: "String(policyPrompt.text).includes('approvals.exec.enabled')"
            message:
              expr: "`approval prompt did not describe the policy change: ${policyPrompt.text}`"
        - set: approvalsExecPending
          value:
            expr: "(await env.gateway.call('config.get', {}, { timeoutMs: 60000 })).config?.approvals?.exec?.enabled ?? null"
        - assert:
            expr: "approvalsExecPending === approvalsExecBefore"
            message:
              expr: "`Full Access applied a permission-policy change before approval: ${approvalsExecPending}`"
        - set: approvalId
          value:
            expr: "String(policyPrompt.text).split('/approve ')[1].split(' ')[0]"
        - set: unauthorizedResult
          value:
            expr: "await env.gateway.call('approval.resolve', { id: approvalId, kind: 'system-agent', decision: 'allow-once', reviewer: { channel: 'qa-channel', accountId: 'default', senderId: 'eve' } }).then(() => 'unexpected-allow', error => String(error))"
        - assert:
            expr: "unauthorizedResult.includes('not found') || unauthorizedResult.includes('unknown')"
            message:
              expr: "'unauthorized reviewer was not refused: ' + unauthorizedResult"
        - set: afterUnauthorized
          value:
            expr: "(await env.gateway.call('config.get', {})).config?.approvals?.exec?.enabled ?? null"
        - assert:
            expr: "afterUnauthorized === approvalsExecBefore"
            message: unauthorized reviewer changed permission policy
        - set: configBeforeRevocation
          value:
            expr: "await env.gateway.call('config.get', {})"
        - set: revocation
          value:
            expr: "await env.gateway.call('config.patch', { raw: JSON.stringify({ commands: { ownerAllowFrom: ['qa-channel:alice'] } }), baseHash: configBeforeRevocation.hash })"
        - call: waitForCondition
          args:
            - lambda:
                async: true
                expr: "await env.gateway.call('config.get', {}).then(value => value.hash === revocation.hash && typeof value.appliedConfigHash === 'string' && value.appliedConfigHash === value.configRevisionHash ? true : undefined)"
            - 30000
            - 100
        - set: revokedResult
          value:
            expr: "await env.gateway.call('approval.resolve', { id: approvalId, kind: 'system-agent', decision: 'allow-once', reviewer: { channel: 'qa-channel', accountId: 'default', senderId: 'bob' } }).then(() => 'unexpected-allow', error => String(error))"
        - assert:
            expr: "revokedResult.includes('not found')"
            message:
              expr: "'revoked reviewer was not refused: ' + revokedResult"
        - set: afterRevokedOnDisk
          value:
            expr: "JSON.parse(await fs.readFile(configBeforeRevocation.path, 'utf8')).approvals?.exec?.enabled ?? null"
        - assert:
            expr: "afterRevokedOnDisk === approvalsExecBefore"
            message: revoked reviewer changed permission policy on disk
        - sendInbound:
            conversation:
              ref: policyConversation
            senderId: alice
            senderName: Alice
            text:
              expr: "`/approve ${approvalId} allow-once`"
            nativeCommand: { name: approve }
        - call: waitForOutboundMessage
          args:
            - ref: state
            - lambda:
                params: [candidate]
                expr: "candidate.direction === 'outbound' && candidate.conversation.id === policyConversation.id && String(candidate.text ?? '').includes(config.policyMarker)"
            - expr: liveTurnTimeoutMs(env, 180000)
        - set: approvalsExecAfter
          value:
            expr: "(await env.gateway.call('config.get', {}, { timeoutMs: 60000 })).config?.approvals?.exec?.enabled ?? null"
        - set: appliedOnDisk
          value:
            expr: "JSON.parse(await fs.readFile(configBeforeRevocation.path, 'utf8')).approvals?.exec?.enabled ?? null"
        - assert:
            expr: "approvalsExecAfter === true && appliedOnDisk === true"
            message:
              expr: "`approved policy change did not apply: ${approvalsExecAfter}`"
      detailsExpr: "JSON.stringify({ approvalsExecBefore, approvalsExecPending, afterUnauthorized, unauthorizedResult, revokedResult, afterRevokedOnDisk, appliedOnDisk, approvalsExecAfter, prompt: policyPrompt.text }, null, 2)"
